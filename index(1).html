<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Простой список задач: добавляйте, отмечайте выполненное и сохраняйте свой прогресс.">
  <title>Список задач</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="todo">
    <header>
      <p class="eyebrow">ОДНО ДЕЛО ЗА РАЗ</p>
      <h1>Список задач<span aria-hidden="true">.</span></h1>
      <p class="subtitle">Освободите голову. Запишите главное.</p>
    </header>
    <form id="task-form" autocomplete="off">
      <label class="sr-only" for="task-input">Новая задача</label>
      <input id="task-input" name="task" type="text" maxlength="500" placeholder="Что нужно сделать?" required>
      <button class="add-button" type="submit"><span aria-hidden="true">＋</span> Добавить</button>
    </form>
    <section aria-label="Ваши задачи">
      <div class="list-heading"><h2>МОИ ЗАДАЧИ</h2><span id="counter" aria-live="polite"></span></div>
      <ul id="task-list"></ul>
      <div id="empty-state"><div class="empty-icon" aria-hidden="true">✓</div><p>Пока всё спокойно</p><span>Добавьте первую задачу выше.</span></div>
    </section>
    <p id="message" role="status"></p>
    <footer><span aria-hidden="true">◦</span> Ваши задачи сохраняются в этом браузере</footer>
  </main>
</body>
</html>
